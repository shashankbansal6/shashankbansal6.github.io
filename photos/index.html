    <script>
      // same theme choice as the main page (shared through localStorage)
      (function () {
        var q = new URLSearchParams(location.search).get('theme');
        var t = q;
        try { t = q || localStorage.getItem('theme'); if (q) localStorage.setItem('theme', q); } catch (e) {}
        if (t !== 'ink') {
          document.documentElement.dataset.theme = 'watercolor';
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = 'https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap';
          document.head.appendChild(l);
        }
      })();
    </script>
    <style>
      html, body { background: #0d0d0c; color: #ece8e0; margin: 0; }
      html[data-theme='watercolor'], html[data-theme='watercolor'] body { background: #f2ead9; color: #2a231e; }
    </style>

  <body>
    <header class="top">
      <a class="back" href="/">← Shashank Bansal</a>
      <nav>
        <a href="/#about">About</a>

        <div class="theme-switch" role="group" aria-label="Visual theme">

    <main>
      <section class="intro">
        <p class="kicker">Photos</p>
        <h1>Photos</h1>
        <p class="lede">From the lab and out of it, collected along the way. Scroll the timeline, or tap any photo to see it large (arrow keys work too).</p>
        <p class="meta" id="meta"></p>
      </section>

      <div class="layout">
        <ol class="years" id="years" aria-label="Jump to a year"></ol>
        <div class="chapters" id="chapters"></div>
      </div>
    </main>

    <footer class="foot">
      <a href="/">← Back to the brain</a>
      <p>© <span id="year"></span> Shashank Bansal</p>
    </footer>

    <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
      <button type="button" class="lb-x" aria-label="Close">×</button>
      <button type="button" class="lb-nav prev" aria-label="Previous photo">‹</button>
      <figure>
        <img alt="" />
        <figcaption><b></b><span></span></figcaption>
      </figure>
      <button type="button" class="lb-nav next" aria-label="Next photo">›</button>
    </div>

    <script type="module" src="./photos.js"></script>
